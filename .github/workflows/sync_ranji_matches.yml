name: Auto-Sync Ranji Trophy Matches

on:
  schedule:
    # Run every 3 hours daily
    - cron: '0 */3 * * *'
  # Allow manual trigger anytime from GitHub Actions tab
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Ranji Trophy Auto-Sync
        run: |
          python utils/auto_sync_ranji.py

      - name: Commit and Push New Matches
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add "data/BCCI Domestic/International/*.json"
          if git diff --staged --quiet; then
            echo "No new match updates to commit."
          else
            git commit -m "Auto-sync Ranji Trophy matches from BCCI [skip ci]"
            git push origin main
          fi
